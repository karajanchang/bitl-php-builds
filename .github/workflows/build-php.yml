name: Build PHP

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build (e.g., 8.4.3)'
        required: true
        type: string
        default: '8.4.3'

jobs:
  build:
    strategy:
      # Let each arch report its own result instead of cancelling its sibling.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # softprops/action-gh-release needs write access to create the release.
    permissions:
      contents: write
    env:
      PHP_VERSION: ${{ inputs.php_version || '8.4.3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download spc binary
        run: |
          SPC_ARCH="$(uname -m)"
          [[ "${SPC_ARCH}" == "arm64" ]] && SPC_ARCH="aarch64"
          curl -fSL "https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.1/spc-macos-${SPC_ARCH}.tar.gz" -o spc.tar.gz
          tar -xzf spc.tar.gz
          chmod +x spc

      # GitHub's macOS images no longer ship autoconf; let spc install what it needs.
      - name: Install build tools
        run: ./spc doctor --auto-fix

      - name: Download sources
        env:
          # spc queries the GitHub API for nearly every dependency; unauthenticated
          # requests hit the rate limit and 403 mid-download.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTENSIONS=$(cat config/extensions.txt | tr '\n' ',' | sed 's/,$//')
          # spc scrapes the openldap release dir for the newest tarball; 2.7.0 broke
          # its 2.6-era build patches, so pin until spc supports it.
          ./spc download --with-php=${{ env.PHP_VERSION }} --for-extensions="${EXTENSIONS}" \
            -U "ldap:https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-2.6.14.tgz"

      - name: Build PHP
        run: |
          EXTENSIONS=$(cat config/extensions.txt | tr '\n' ',' | sed 's/,$//')
          ./spc build --build-cli --build-fpm --debug "${EXTENSIONS}"

      - name: Upload spc logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-logs-${{ matrix.arch }}
          path: log/
          if-no-files-found: ignore

      - name: Package binaries
        run: |
          VERSION="${{ env.PHP_VERSION }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist/bin
          cp buildroot/bin/php dist/bin/
          cp buildroot/bin/php-fpm dist/bin/
          cd dist
          tar -czf "php-${VERSION}-macos-${ARCH}.tar.gz" bin/
          cd ..
          mv "dist/php-${VERSION}-macos-${ARCH}.tar.gz" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "php-${{ env.PHP_VERSION }}"
          name: "PHP ${{ env.PHP_VERSION }}"
          files: "php-${{ env.PHP_VERSION }}-macos-${{ matrix.arch }}.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
